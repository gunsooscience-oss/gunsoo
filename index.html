<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Site</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      line-height: 1.6;
    }
    main { text-align: center; padding: 2rem; }
    h1 { margin: 0 0 .5rem; font-size: clamp(1.75rem, 5vw, 2.5rem); }
    p { margin: 0; opacity: .7; }
  </style>
</head>
<body>
  <main>
    <h1>배포 준비 완료</h1>
    <p>이 파일을 수정하고 push 하면 사이트가 갱신됩니다.</p>
  </main>
</body>
</html>
